# Publie l'application Haru (dossier coreen/) sur GitHub Pages.
# Prérequis : Settings → Pages → Source : « GitHub Actions ».
name: Haru – GitHub Pages

on:
  push:
    branches: [claude/kyara-weapons-card-game-g53sy3, ccr-b11f4f0e-w54v1k, ccr-152f23ed-x3j3ih, ccr-dac92ffb-3d1lfo, ccr-6f1290e9-72roti, claude/haru-ecriture-examens]
    paths: ['coreen/**', '.github/workflows/haru-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: haru-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests du moteur
        run: node --test coreen/tests/*.test.js
      - name: Outils (minification, navigateur de test, contrôle du contraste)
        run: |
          npm i --no-save --prefix /tmp/ci esbuild@0.24.2 playwright@1.49.1 axe-core@4.10.2
          /tmp/ci/node_modules/.bin/playwright install --with-deps chromium
      - name: Version publiée (JavaScript et CSS minifiés)
        working-directory: coreen
        run: cp tools/build.mjs /tmp/ci/build.mjs && node /tmp/ci/build.mjs ../dist
      - name: Tests d'écrans sur la version publiée
        run: |
          python3 -m http.server 8090 --directory dist > /dev/null 2>&1 &
          sleep 1
          NODE_PATH=/tmp/ci/node_modules node coreen/tests/e2e/smoke.cjs http://localhost:8090
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
